name: daily-minnan-weather

on:
  schedule:
    # UTC 11:00 = 北京时间 19:00，确保 20:00 老人打开时已是最新内容
    - cron: '0 11 * * *'
  workflow_dispatch: # 手动触发，用于测试

permissions:
  contents: write

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weather report
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
          BAIDU_API_KEY: ${{ secrets.BAIDU_API_KEY }}
          BAIDU_SECRET_KEY: ${{ secrets.BAIDU_SECRET_KEY }}
        run: python scripts/main.py

      - name: Commit site update
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add site/
          if git diff --cached --quiet; then
            echo "no site changes"
          else
            git commit -m "weather update $(date -u +%F)"
            git push
          fi
