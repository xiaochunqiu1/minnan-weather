name: daily-minnan-weather

on:
  schedule:
    # UTC 11:00 = 北京时间 19:00，确保 20:00 老人打开时已是最新内容
    - cron: '0 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  weather:
    # 防循环：workflow 自己提交的 "weather update ..." 不再触发运行
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'weather update') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (CPU torch + COS SDK)
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run weather report
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
          HF_HUB_DOWNLOAD_TIMEOUT: '120'
        run: python scripts/main.py

      - name: Deploy to CloudBase via COS SDK (stable, no CLI)
        timeout-minutes: 10
        env:
          COS_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: |
          echo "DEBUG: SECRET_ID len=${#COS_SECRET_ID} KEY len=${#COS_SECRET_KEY}"
          rm -f site/audio/*.raw.wav  # 清理 TTS 中间文件
          python scripts/cos_deploy.py site/
