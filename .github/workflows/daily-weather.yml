name: daily-minnan-weather

on:
  schedule:
    # UTC 11:00 = 北京时间 19:00，确保 20:00 老人打开时已是最新内容
    - cron: '0 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  weather:
    # 防循环：workflow 自己提交的 "weather update ..." 不再触发运行
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'weather update') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (CPU torch)
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run weather report
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
          HF_HUB_DOWNLOAD_TIMEOUT: '120'
        run: python scripts/main.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy to CloudBase static hosting
        timeout-minutes: 15
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          npm install -g @cloudbase/cli
          tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"
          rm -f site/audio/*.raw.wav  # 清理 TTS 中间文件（双保险）
          # 先传音频（大文件，最易超时；失败时 latest.json 仍指旧音频，页面可播昨天的）
          for i in 1 2 3; do
            tcb hosting deploy ./site/audio /weather/audio -e "$TCB_ENV_ID" && break
            echo "audio deploy attempt $i failed, retrying in 15s..."; sleep 15
            [ $i -eq 3 ] && exit 1
          done
          # 再传其余（latest.json 最后更新，避免"文案新但音频缺失"的半部署状态）
          for i in 1 2 3; do
            tcb hosting deploy ./site /weather -e "$TCB_ENV_ID" && break
            echo "site deploy attempt $i failed, retrying in 15s..."; sleep 15
            [ $i -eq 3 ] && exit 1
          done
