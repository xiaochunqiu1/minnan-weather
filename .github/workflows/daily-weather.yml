name: daily-minnan-weather

on:
  schedule:
    # UTC 11:00 = 北京时间 19:00，确保 20:00 老人打开时已是最新内容
    - cron: '13 16 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  weather:
    # 防循环：workflow 自己提交的 "weather update ..." 不再触发运行
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'weather update') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (CPU torch + COS SDK)
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run weather report
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
          HF_HUB_DOWNLOAD_TIMEOUT: '120'
        run: python scripts/main.py

      - name: Compress audio to MP3 (减小跨境传输体积)
        run: |
          set -e
          echo "ffmpeg check:"; which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          ffmpeg -version | head -1
          cd site/audio
          for f in *.wav; do
            [ -e "$f" ] || continue
            echo "converting $f ..."
            ffmpeg -y -i "$f" -codec:a libmp3lame -b:a 64k "${f%.wav}.mp3"
            rm -f "$f"
          done
          cd ../..
          python3 -c "import json; p='site/latest.json'; d=json.load(open(p)); d['audio']=d['audio'].replace('.wav','.mp3'); json.dump(d, open(p,'w'), ensure_ascii=False, indent=2)"
          echo "after compress:"; ls -la site/audio/

      - name: Deploy to CloudBase via COS SDK (分块上传, 跨境稳定)
        timeout-minutes: 10
        env:
          COS_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: |
          rm -f site/audio/*.raw.wav
          python scripts/cos_deploy.py site/
